<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDIS Atlanta Overlay Preview</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#071014;font-family:Arial;color:white}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle,#17323a 0,#071014 50%,#030608 100%)}
.layer{position:absolute;left:50%;top:50%;width:min(92vh,150vw);height:min(92vh,150vw);object-fit:contain;transform:translate(-50%,-50%);pointer-events:none}
.back{width:min(103vh,168vw);height:min(103vh,168vw)}
.coin{position:absolute;left:50%;top:50%;width:160px;height:160px;border:2px dashed #ffffff80;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;text-align:center;z-index:8}
.note{position:fixed;z-index:20;top:12px;left:12px;right:12px;background:#071014d9;border:1px solid #ffffff30;padding:10px 12px;border-radius:12px;font-size:12px}
#front{opacity:0;animation:frontIn .82s ease-out forwards}
#mid{opacity:0;animation:midIn .9s ease-out 1s forwards}
.back{opacity:0;animation:backIn 1.2s ease-out 3s forwards}
@keyframes frontIn{to{opacity:1}}
@keyframes midIn{to{opacity:1}}
@keyframes backIn{to{opacity:1}}
</style>
</head>
<body>
<div class="stage">
<div class="note">
<img src="./assets/ui/idis-logo.png?v=20260821-stage11" alt="IDIS Americas"
     style="width:92px;height:auto;display:block;margin-bottom:8px">
TOP starts immediately • MIDDLE at 1 second • VIDEO BACK at 3 seconds.
</div>
<video id="backVideo" class="layer back" muted loop playsinline preload="auto">
  <source src="./assets/parallax/atlanta/layer-1-back.mp4?v=20260821-stage11" type="video/mp4">
</video>
<img id="mid" class="layer" src="./assets/parallax/atlanta/layer-2-middle.png?v=20260821-stage11">
<img id="front" class="layer" src="./assets/parallax/atlanta/layer-3-front.png?v=20260821-stage11">
<div class="coin">LIVE COIN<br>AREA</div>
</div>
<script>
const mid=document.querySelector('#mid'), front=document.querySelector('#front');
function move(x,y){
 const dx=x-.5,dy=y-.5;
 mid.style.transform=`translate(calc(-50% + ${dx*24}px),calc(-50% + ${dy*18-16}px))`;
 front.style.transform=`translate(calc(-50% + ${dx*70}px),calc(-50% + ${dy*50}px)) scale(1.02)`;
}
addEventListener('pointermove',e=>move(e.clientX/innerWidth,e.clientY/innerHeight));
move(.5,.5);
const backVideo=document.querySelector('#backVideo');
setTimeout(()=>{ if(backVideo){ backVideo.muted=true; backVideo.play().catch(()=>{}); } },3000);
</script>
</body></html>
