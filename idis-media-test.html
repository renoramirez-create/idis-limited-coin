<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IDIS Media Layer Test</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#071014;color:#fff;font-family:Arial,sans-serif}
  .stage{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(45deg,#173238 25%,transparent 25%) 0 0/40px 40px,
      linear-gradient(-45deg,#173238 25%,transparent 25%) 0 0/40px 40px,
      linear-gradient(45deg,transparent 75%,#173238 75%) 0 0/40px 40px,
      linear-gradient(-45deg,transparent 75%,#173238 75%) 0 0/40px 40px,
      #0b2025;
  }
  h1{position:relative;z-index:100;margin:0;padding:20px;text-align:center;font-size:20px}
  .alpha{
    position:absolute;z-index:10;left:50%;top:48%;
    width:min(100vw,900px);height:72vh;object-fit:contain;
    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
  }
  .ytwrap{
    position:absolute;z-index:30;left:50%;top:58%;
    width:min(90vw,800px);aspect-ratio:16/9;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.35);
    background:#000;
  }
  iframe{width:100%;height:100%;border:0}
  .logo{
    position:absolute;z-index:50;left:50%;top:70px;
    width:min(190px,40vw);transform:translateX(-50%);
    filter:drop-shadow(0 6px 14px #000);
  }
  .note{position:absolute;z-index:100;left:16px;right:16px;bottom:18px;text-align:center;font-size:12px}
</style>
</head>
<body>
  <div class="stage">
    <h1>Build 28 Media Layer Test</h1>
    <video class="alpha" autoplay muted loop playsinline
      src="./assets/video/idis-showcase-alpha.webm?v=20260821-layerfix28"></video>
    <div class="ytwrap">
      <iframe
        src="https://www.youtube.com/embed/G7vGMc4Z2os?autoplay=1&mute=1&controls=0&playsinline=1&rel=0"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
    <img class="logo" src="./assets/ui/idis-logo.png?v=20260821-layerfix28" alt="IDIS">
    <div class="note">
      Checkerboard should show through black areas of the WebM.
      IDIS logo must remain above both videos.
    </div>
  </div>
</body>
</html>
